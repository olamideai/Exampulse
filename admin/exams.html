<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Settings - Admin</title>
    <link rel="stylesheet" href="../css/main.css">
    <style>
        .admin-nav { background: #1a237e; }
        .exam-settings { max-width: 600px; margin: 0 auto; }
        .setting-item { background: white; padding: 25px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .setting-item h3 { margin-bottom: 15px; color: #1a237e; }
    </style>
</head>
<body>
    <nav class="nav admin-nav">
        <div class="nav-brand">🔐 Exam Settings</div>
        <div class="nav-links">
            <a href="dashboard.html" style="color: white;">Dashboard</a>
            <a href="#" onclick="logout()" style="color: white;">Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="exam-settings" id="settingsContainer">
            <div class="loading" style="display: block;">
                <div class="spinner"></div>
                <p>Loading settings...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db } from '../js/firebase-config.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        let exams = [];

        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = 'login.html';
            else loadSettings();
        });

        async function loadSettings() {
            const snapshot = await getDocs(collection(db, 'exams'));
            exams = [];
            snapshot.forEach(doc => exams.push({ id: doc.id, ...doc.data() }));
            displaySettings();
        }

        function displaySettings() {
            const container = document.getElementById('settingsContainer');
            container.innerHTML = exams.map(exam => `
                <div class="setting-item">
                    <h3>${exam.name}</h3>
                    <div class="form-group">
                        <label>Subjects per Quiz</label>
                        <input type="number" id="subjects-${exam.id}" value="${exam.subjectsPerQuiz}" min="1" max="10">
                    </div>
                    <div class="form-group">
                        <label>Duration (minutes)</label>
                        <input type="number" id="duration-${exam.id}" value="${exam.duration}" min="10" max="300">
                    </div>
                    <div class="form-group">
                        <label>Total Questions</label>
                        <input type="number" id="questions-${exam.id}" value="${exam.totalQuestions}" min="10" max="500">
                    </div>
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="active-${exam.id}" ${exam.isActive ? 'checked' : ''}> Active
                        </label>
                    </div>
                    <button class="btn" onclick="saveExam('${exam.id}')" style="width: 100%;">Save Changes</button>
                </div>
            `).join('');
        }

        window.saveExam = async function(examId) {
            const data = {
                subjectsPerQuiz: parseInt(document.getElementById(`subjects-${examId}`).value),
                duration: parseInt(document.getElementById(`duration-${examId}`).value),
                totalQuestions: parseInt(document.getElementById(`questions-${examId}`).value),
                isActive: document.getElementById(`active-${examId}`).checked
            };

            try {
                await updateDoc(doc(db, 'exams', examId), data);
                alert('Settings saved!');
                loadSettings();
            } catch (error) {
                alert('Error saving: ' + error.message);
            }
        };

        window.logout = async function() {
            await signOut(auth);
            window.location.href = 'login.html';
        };
    </script>
</body>
</html>
