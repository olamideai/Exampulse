<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - CBT Simulator</title>
    <link rel="stylesheet" href="../css/main.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a237e 0%, #283593 100%);
        }
        .admin-badge {
            background: #d32f2f;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div style="min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px;">
        <div style="background: white; border-radius: 20px; padding: 40px; width: 100%; max-width: 400px; text-align: center;">
            <h1 style="color: #1a237e; margin-bottom: 10px;">🔐 Admin Portal</h1>
            <p style="color: #666; margin-bottom: 30px;">CBT Simulator Administration</p>
            
            <form id="adminLoginForm">
                <div class="form-group" style="text-align: left;">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="admin@example.com" required>
                </div>
                <div class="form-group" style="text-align: left;">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn" style="width: 100%; margin-top: 20px;">Login</button>
                <div class="error" id="error"></div>
            </form>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Verifying...</p>
            </div>
            
            <a href="../index.html" style="display: block; margin-top: 20px; color: #666; text-decoration: none;">← Back to Student Login</a>
        </div>
    </div>

    <script type="module">
        import { auth, db } from '../js/firebase-config.js';
        import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            
            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                // Check if admin
                const adminDoc = await getDoc(doc(db, 'admins', user.uid));
                
                if (adminDoc.exists()) {
                    window.location.href = 'dashboard.html';
                } else {
                    await auth.signOut();
                    document.getElementById('error').textContent = 'Access denied. Not an admin.';
                    document.getElementById('error').style.display = 'block';
                }
            } catch (error) {
                document.getElementById('error').textContent = 'Invalid credentials';
                document.getElementById('error').style.display = 'block';
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        });
    </script>
</body>
</html>
