<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - CBT Simulator</title>
    <link rel="stylesheet" href="../css/main.css">
    <style>
        .admin-nav {
            background: #1a237e;
        }
        .admin-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        .admin-card:hover {
            transform: translateY(-5px);
        }
        .admin-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        .admin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
        }
        .stat-box h3 {
            font-size: 36px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <nav class="nav admin-nav">
        <div class="nav-brand">🔐 Admin Dashboard</div>
        <div class="nav-links">
            <span id="adminEmail" style="color: white; margin-right: 20px;"></span>
            <a href="#" onclick="logout()" style="color: white;">Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="admin-stats">
            <div class="stat-box">
                <h3 id="totalUsers">0</h3>
                <p>Total Users</p>
            </div>
            <div class="stat-box" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                <h3 id="totalQuestions">0</h3>
                <p>Total Questions</p>
            </div>
            <div class="stat-box" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
                <h3 id="totalSubjects">0</h3>
                <p>Subjects</p>
            </div>
            <div class="stat-box" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);">
                <h3 id="examsToday">0</h3>
                <p>Exams Today</p>
            </div>
        </div>

        <div class="grid">
            <div class="admin-card" onclick="location.href='subjects.html'">
                <div class="admin-icon">📚</div>
                <h3>Manage Subjects</h3>
                <p>Add, edit, or deactivate subjects</p>
            </div>
            <div class="admin-card" onclick="location.href='questions.html'">
                <div class="admin-icon">❓</div>
                <h3>Manage Questions</h3>
                <p>Add questions to subjects</p>
            </div>
            <div class="admin-card" onclick="location.href='exams.html'">
                <div class="admin-icon">📝</div>
                <h3>Exam Settings</h3>
                <p>Configure exam types and rules</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db } from '../js/firebase-config.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            
            document.getElementById('adminEmail').textContent = user.email;
            
            // Load stats
            try {
                const usersSnap = await getDocs(collection(db, 'users'));
                document.getElementById('totalUsers').textContent = usersSnap.size;
                
                const questionsSnap = await getDocs(collection(db, 'questions'));
                document.getElementById('totalQuestions').textContent = questionsSnap.size;
                
                const subjectsSnap = await getDocs(collection(db, 'subjects'));
                document.getElementById('totalSubjects').textContent = subjectsSnap.size;
                
                // Exams today (mock - would need proper query)
                document.getElementById('examsToday').textContent = '12';
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        });

        window.logout = async function() {
            try {
                await signOut(auth);
                window.location.href = 'login.html';
            } catch (error) {
                console.error('Logout error:', error);
            }
        };
    </script>
</body>
</html>
