<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam - CBT Simulator</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/exam.css">
</head>
<body>
    <nav class="nav">
        <div class="nav-brand">🎓 CBT Simulator</div>
        <div class="nav-links">
            <span id="userName"></span>
        </div>
    </nav>

    <div class="exam-container">
        <!-- Sidebar -->
        <div class="exam-sidebar">
            <div class="sidebar-header">
                <h3>Time Remaining</h3>
                <div class="timer" id="timer">02:00:00</div>
            </div>
            
            <div class="question-palette">
                <div class="palette-title">Question Palette</div>
                <div class="palette-grid" id="paletteGrid"></div>
            </div>
            
            <div class="sidebar-footer">
                <div class="legend">
                    <div class="legend-item">
                        <div class="legend-box"></div>
                        <span>Unanswered</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-box answered"></div>
                        <span>Answered</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-box flagged"></div>
                        <span>Flagged</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="exam-main">
            <div class="exam-header">
                <div class="exam-info">
                    <h2 id="examTitle">JAMB UTME</h2>
                    <p id="subjectName">English Language</p>
                </div>
                <div class="exam-tools">
                    <button class="tool-btn calculator" onclick="toggleCalculator()">
                        🧮 Calculator
                    </button>
                    <button class="tool-btn submit" onclick="confirmSubmit()">
                        Submit Exam
                    </button>
                </div>
            </div>

            <div class="question-area">
                <div class="question-container">
                    <div class="question-header">
                        <span class="question-number" id="questionNumber">Question 1</span>
                        <button class="flag-btn" id="flagBtn" onclick="toggleFlag()">
                            🚩 Flag for Review
                        </button>
                    </div>
                    
                    <div class="question-text" id="questionText">
                        Loading question...
                    </div>
                    
                    <div class="options" id="optionsContainer">
                        <!-- Options generated by JS -->
                    </div>
                </div>
            </div>

            <div class="exam-nav">
                <button class="nav-btn prev" id="prevBtn" onclick="previousQuestion()">
                    ← Previous
                </button>
                <span class="question-counter" id="questionCounter">1 / 180</span>
                <button class="nav-btn next" id="nextBtn" onclick="nextQuestion()">
                    Next →
                </button>
            </div>
        </div>
    </div>

    <!-- Calculator Modal -->
    <div class="modal" id="calculatorModal">
        <div class="modal-content">
            <div class="calculator-display" id="calcDisplay">0</div>
            <div class="calculator-buttons">
                <button class="calc-btn clear" onclick="calcClear()">C</button>
                <button class="calc-btn operator" onclick="calcOperator('/')">÷</button>
                <button class="calc-btn operator" onclick="calcOperator('*')">×</button>
                <button class="calc-btn operator" onclick="calcOperator('-')">−</button>
                
                <button class="calc-btn" onclick="calcNumber('7')">7</button>
                <button class="calc-btn" onclick="calcNumber('8')">8</button>
                <button class="calc-btn" onclick="calcNumber('9')">9</button>
                <button class="calc-btn operator" onclick="calcOperator('+')">+</button>
                
                <button class="calc-btn" onclick="calcNumber('4')">4</button>
                <button class="calc-btn" onclick="calcNumber('5')">5</button>
                <button class="calc-btn" onclick="calcNumber('6')">6</button>
                <button class="calc-btn" onclick="calcNumber('.')">.</button>
                
                <button class="calc-btn" onclick="calcNumber('1')">1</button>
                <button class="calc-btn" onclick="calcNumber('2')">2</button>
                <button class="calc-btn" onclick="calcNumber('3')">3</button>
                <button class="calc-btn" onclick="calcPercent()">%</button>
                
                <button class="calc-btn" onclick="calcNumber('0')">0</button>
                <button class="calc-btn equals" onclick="calcEquals()">=</button>
            </div>
            <button class="btn" style="width: 100%; margin-top: 15px;" onclick="toggleCalculator()">Close</button>
        </div>
    </div>

    <!-- Submit Confirmation Modal -->
    <div class="modal submit-modal" id="submitModal">
        <div class="modal-content">
            <h3>Submit Exam?</h3>
            <div class="submit-summary">
                <div class="summary-item">
                    <span>Total Questions:</span>
                    <strong id="totalQuestions">180</strong>
                </div>
                <div class="summary-item">
                    <span>Answered:</span>
                    <strong id="answeredCount">0</strong>
                </div>
                <div class="summary-item">
                    <span>Flagged:</span>
                    <strong id="flaggedCount">0</strong>
                </div>
                <div class="summary-item">
                    <span>Unanswered:</span>
                    <strong id="unansweredCount">180</strong>
                </div>
            </div>
            <p class="warning-text" id="unansweredWarning">You have unanswered questions!</p>
            <div class="modal-buttons">
                <button class="btn" onclick="closeSubmitModal()">Continue Exam</button>
                <button class="btn btn-danger" onclick="submitExam()">Submit Now</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db } from './js/firebase-config.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, query, where, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // State
        let currentUser = null;
        let selectedExam = JSON.parse(localStorage.getItem('selectedExam'));
        let selectedSubjects = JSON.parse(localStorage.getItem('selectedSubjects')) || [];
        let questions = [];
        let currentQuestionIndex = 0;
        let answers = {};
        let flagged = new Set();
        let timeRemaining = 0;
        let timerInterval = null;

        // Calculator state
        let calcDisplay = '0';
        let calcFirstOperand = null;
        let calcOperator = null;
        let calcWaitingForSecondOperand = false;

        // Check auth
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'index.html';
            } else {
                currentUser = user;
                document.getElementById('userName').textContent = user.displayName || user.email;
                initExam();
            }
        });

        async function initExam() {
            if (!selectedExam || !selectedSubjects.length) {
                window.location.href = 'select-exam.html';
                return;
            }

            document.getElementById('examTitle').textContent = selectedExam.name;
            timeRemaining = selectedExam.duration * 60; // Convert to seconds
            
            await loadQuestions();
            startTimer();
            displayQuestion();
            updatePalette();
        }

        async function loadQuestions() {
            // For demo, generate dummy questions
            // In production, fetch from Firestore based on selectedSubjects
            questions = [];
            let questionNumber = 1;
            
            for (let subject of selectedSubjects) {
                const subjectQuestions = selectedExam.subjectsPerQuiz > 1 ? 
                    (subject.code === 'ENG' ? 60 : 40) : 50;
                
                for (let i = 0; i < subjectQuestions; i++) {
                    questions.push({
                        id: `q${questionNumber}`,
                        number: questionNumber,
                        subject: subject.name,
                        subjectCode: subject.code,
                        text: `This is question ${questionNumber} for ${subject.name}. What is the correct answer?`,
                        options: ['Option A', 'Option B', 'Option C', 'Option D']
                    });
                    questionNumber++;
                }
            }
            
            document.getElementById('totalQuestions').textContent = questions.length;
        }

        function startTimer() {
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                timeRemaining--;
                updateTimerDisplay();
                
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    submitExam();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const hours = Math.floor(timeRemaining / 3600);
            const minutes = Math.floor((timeRemaining % 3600) / 60);
            const seconds = timeRemaining % 60;
            
            const display = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            const timerEl = document.getElementById('timer');
            timerEl.textContent = display;
            
            // Warning colors
            timerEl.classList.remove('warning', 'danger');
            if (timeRemaining < 300) { // Less than 5 minutes
                timerEl.classList.add('danger');
            } else if (timeRemaining < 600) { // Less than 10 minutes
                timerEl.classList.add('warning');
            }
        }

        function displayQuestion() {
            const q = questions[currentQuestionIndex];
            
            document.getElementById('questionNumber').textContent = `Question ${q.number}`;
            document.getElementById('subjectName').textContent = q.subject;
            document.getElementById('questionText').textContent = q.text;
            document.getElementById('questionCounter').textContent = `${currentQuestionIndex + 1} / ${questions.length}`;
            
            // Update flag button
            const flagBtn = document.getElementById('flagBtn');
            if (flagged.has(q.id)) {
                flagBtn.classList.add('active');
                flagBtn.innerHTML = '🚩 Flagged';
            } else {
                flagBtn.classList.remove('active');
                flagBtn.innerHTML = '🚩 Flag for Review';
            }
            
            // Generate options
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            
            ['A', 'B', 'C', 'D'].forEach((letter, index) => {
                const option = document.createElement('div');
                option.className = 'option';
                if (answers[q.id] === letter) {
                    option.classList.add('selected');
                }
                option.onclick = () => selectOption(letter);
                option.innerHTML = `
                    <span class="option-letter">${letter}</span>
                    <span>${q.options[index]}</span>
                `;
                optionsContainer.appendChild(option);
            });
            
            // Update navigation buttons
            document.getElementById('prevBtn').disabled = currentQuestionIndex === 0;
            document.getElementById('nextBtn').textContent = 
                currentQuestionIndex === questions.length - 1 ? 'Finish →' : 'Next →';
            
            updatePalette();
        }

        function selectOption(letter) {
            const q = questions[currentQuestionIndex];
            answers[q.id] = letter;
            displayQuestion();
        }

        window.toggleFlag = function() {
            const q = questions[currentQuestionIndex];
            if (flagged.has(q.id)) {
                flagged.delete(q.id);
            } else {
                flagged.add(q.id);
            }
            displayQuestion();
        };

        window.previousQuestion = function() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                displayQuestion();
            }
        };

        window.nextQuestion = function() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                displayQuestion();
            } else {
                confirmSubmit();
            }
        };

        function updatePalette() {
            const grid = document.getElementById('paletteGrid');
            grid.innerHTML = '';
            
            questions.forEach((q, index) => {
                const btn = document.createElement('button');
                btn.className = 'palette-btn';
                btn.textContent = index + 1;
                
                if (answers[q.id]) {
                    btn.classList.add('answered');
                }
                if (flagged.has(q.id)) {
                    btn.classList.add('flagged');
                }
                if (index === currentQuestionIndex) {
                    btn.classList.add('current');
                }
                
                btn.onclick = () => {
                    currentQuestionIndex = index;
                    displayQuestion();
                };
                
                grid.appendChild(btn);
            });
        }

        // Calculator functions
        window.toggleCalculator = function() {
            document.getElementById('calculatorModal').classList.toggle('active');
        };

        window.calcNumber = function(num) {
            if (calcWaitingForSecondOperand) {
                calcDisplay = num;
                calcWaitingForSecondOperand = false;
            } else {
                calcDisplay = calcDisplay === '0' ? num : calcDisplay + num;
            }
            updateCalcDisplay();
        };

        window.calcOperator = function(op) {
            const inputValue = parseFloat(calcDisplay);
            
            if (calcOperator && calcWaitingForSecondOperand) {
                calcOperator = op;
                return;
            }
            
            if (calcFirstOperand === null) {
                calcFirstOperand = inputValue;
            } else if (calcOperator) {
                const result = calculate(calcFirstOperand, inputValue, calcOperator);
                calcDisplay = String(result);
                calcFirstOperand = result;
            }
            
            calcOperator = op;
            calcWaitingForSecondOperand = true;
            updateCalcDisplay();
        };

        window.calcEquals = function() {
            if (!calcOperator || calcWaitingForSecondOperand) return;
            
            const inputValue = parseFloat(calcDisplay);
            const result = calculate(calcFirstOperand, inputValue, calcOperator);
            
            calcDisplay = String(result);
            calcFirstOperand = null;
            calcOperator = null;
            calcWaitingForSecondOperand = false;
            updateCalcDisplay();
        };

        window.calcClear = function() {
            calcDisplay = '0';
            calcFirstOperand = null;
            calcOperator = null;
            calcWaitingForSecondOperand = false;
            updateCalcDisplay();
        };

        window.calcPercent = function() {
            const current = parseFloat(calcDisplay);
            calcDisplay = String(current / 100);
            updateCalcDisplay();
        };

        function calculate(first, second, op) {
            switch(op) {
                case '+': return first + second;
                case '-': return first - second;
                case '*': return first * second;
                case '/': return second !== 0 ? first / second : 0;
                default: return second;
            }
        }

        function updateCalcDisplay() {
            document.getElementById('calcDisplay').textContent = calcDisplay;
        }

        // Submit functions
        window.confirmSubmit = function() {
            const answered = Object.keys(answers).length;
            const total = questions.length;
            const flaggedCount = flagged.size;
            
            document.getElementById('answeredCount').textContent = answered;
            document.getElementById('flaggedCount').textContent = flaggedCount;
            document.getElementById('unansweredCount').textContent = total - answered;
            
            const warning = document.getElementById('unansweredWarning');
            if (answered < total) {
                warning.style.display = 'block';
            } else {
                warning.style.display = 'none';
            }
            
            document.getElementById('submitModal').classList.add('active');
        };

        window.closeSubmitModal = function() {
            document.getElementById('submitModal').classList.remove('active');
        };

        window.submitExam = async function() {
            clearInterval(timerInterval);
            
            // Calculate scores
            const subjectScores = {};
            const totalQuestions = {};
            
            selectedSubjects.forEach(sub => {
                subjectScores[sub.code] = 0;
                totalQuestions[sub.code] = 0;
            });
            
            // Mock scoring (in production, check against correct answers)
            questions.forEach(q => {
                totalQuestions[q.subjectCode]++;
                if (answers[q.id]) {
                    // Random scoring for demo (remove in production)
                    if (Math.random() > 0.5) {
                        subjectScores[q.subjectCode]++;
                    }
                }
            });
            
            // Calculate percentages
            const results = {
                exam: selectedExam,
                subjects: selectedSubjects.map(sub => ({
                    name: sub.name,
                    code: sub.code,
                    score: subjectScores[sub.code],
                    total: totalQuestions[sub.code],
                    percentage: Math.round((subjectScores[sub.code] / totalQuestions[sub.code]) * 100)
                })),
                totalScore: 0,
                maxScore: selectedExam.subjectsPerQuiz * 100,
                timeUsed: (selectedExam.duration * 60) - timeRemaining,
                completedAt: new Date()
            };
            
            results.totalScore = results.subjects.reduce((sum, s) => sum + s.percentage, 0);
            
            // Save to localStorage for results page
            localStorage.setItem('examResults', JSON.stringify(results));
            // Save to Firestore
            try {
                await addDoc(collection(db, 'users', currentUser.uid, 'examHistory'), results);
            } catch (error) {
                console.error('Error saving results:', error);
            }
            
            window.location.href = 'results.html';
        };
    </script>
</body>
</html>
